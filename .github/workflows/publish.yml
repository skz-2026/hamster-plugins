name: Publish plugins

# plugins/** 变更 → 全量打包 plugins/ 下所有插件 → 发/更 <id>@<version> Release
# → 重算 sha256 重建 registry.json。全量幂等（同版本覆盖上传），插件少、打包快，
# 比变更检测可靠（pwsh 对原生命令 stderr+EAP=Stop 的行为有坑）。
on:
  push:
    branches: [main]
    paths: ['plugins/**', '.github/workflows/publish.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pack & publish all plugins
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $entries = @()
          $dirs = Get-ChildItem plugins -Directory
          Write-Host "plugins: $($dirs.Name -join ', ')"
          foreach ($d in $dirs) {
            $id = $d.Name
            $dir = "plugins/$id"
            if (-not (Test-Path "$dir/plugin.json")) { Write-Host "skip $id (no plugin.json)"; continue }
            $m = Get-Content "$dir/plugin.json" -Raw | ConvertFrom-Json
            $ver = $m.version
            $zip = "$id-$ver.zip"
            # 文件清单：plugin.json + 声明入口 + 其余非隐藏文件（zip 根部不带目录前缀）
            Push-Location $dir
            $files = @('plugin.json')
            if ($m.entry) { $files += $m.entry }
            if ($m.page) { $files += $m.page }
            $files += (Get-ChildItem -File |
              Where-Object { $files -notcontains $_.Name -and -not $_.Name.StartsWith('.') }).Name
            tar -a -cf "../../$zip" @($files | Where-Object { $_ })
            Pop-Location
            $sha = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
            $size = (Get-Item $zip).Length
            # 发/复用 Release（同 tag 重推 = 更新资产）；已存在时 create 报错忽略，upload --clobber 覆盖
            gh release create "$id@$ver" --title "$id@$ver" --notes "auto-packaged from plugins/$id" 2>$null
            if ($LASTEXITCODE -ne 0) { Write-Host "release $id@$ver exists, uploading anyway" }
            gh release upload "$id@$ver" $zip --clobber
            $entries += [ordered]@{
              id = $id; name = $m.name; version = $ver
              description = "$(if ($m.description) { $m.description } else { '' })"
              author = "$(if ($m.author) { $m.author } else { '' })"
              icon = $m.icon; entry = $m.entry; page = $m.page
              permissions = @(if ($m.permissions) { $m.permissions } else { @() })
              zipUrl = "releases/download/$id@$ver/$zip"
              sha256 = $sha; size = $size
            }
            Remove-Item $zip
          }
          if ($entries.Count -eq 0) { throw "没有可发布的插件（plugins/ 为空或全部无 plugin.json）" }
          # 全量重建 registry.json
          $reg = [ordered]@{
            version = 1
            updated = (Get-Date -AsUTC -Format "yyyy-MM-ddTHH:mm:ssZ")
            plugins = @($entries | Sort-Object { $_.id })
          }
          $reg | ConvertTo-Json -Depth 6 | Set-Content registry.json -Encoding utf8
          git config user.name "plugin-bot"
          git config user.email "bot@users.noreply.github.com"
          git add registry.json
          git commit -m "chore: update registry.json [skip ci]" || Write-Host "registry unchanged"
          git push
